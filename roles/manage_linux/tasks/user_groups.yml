---
- name: Create groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: >-
    {{
      users
      | map(attribute='groups', default=[])
      | flatten
      | reject('equalto', '')
      | reject('none')
      | list
      | unique
    }}

- name: Create users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups | default('') }}"
    append: "{{ item.append | default(false) }}"
    create_home: "{{ item.create_home | default(false) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
  loop: "{{ users }}"

